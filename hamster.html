<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pose Detection</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  #wrap { position: fixed; top: 0; left: 0; }
  canvas { display: block; }
  #status { position: fixed; top: 12px; left: 12px; color: #9f9; font: 14px monospace; }
  #panel {
    position: fixed; top: 0; left: 0;
    width: 300px; height: 100vh;
    background: rgba(0,0,0,0.7);
    padding: 10px;
    box-sizing: border-box;
  }
  #panel h2 {
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: #fff;
    margin: 0 0 8px 0;
    text-transform: lowercase;
    letter-spacing: 1px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  #grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 4px;
  }
  @media (max-width: 768px) {
    #panel {
      top: auto !important;
      bottom: 0;
      left: 0 !important;
      width: 100% !important;
      height: auto;
      border-top: 1px solid #333;
    }
    #grid {
      grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
    }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas"></canvas></div>
<div id="status">loading…</div>
<div id="panel">
  <h2>collected <span id="counter" style="font-size:12px;color:#aaa;font-weight:normal;">0/17</span></h2>
  <div id="grid"></div>
</div>

<script type="module">
import {
  FilesetResolver, HandLandmarker, FaceLandmarker, PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";

const VISION_VER = "0.10.18";
const HAND_MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const FACE_MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const POSE_MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

const statusEl = document.getElementById("status");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

/* ---------- constants (identical indices to the Python version) ---------- */
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];
const LIP_IDS = [13, 14, 78, 308];
const FINGER_JOINTS = [[8,6,5],[12,10,9],[16,14,13],[20,18,17]];

/* ---------- small math helpers ---------- */
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* ---------- finger primitives ---------- */
const isFingerExtended = (lm, tip, pip) => lm[tip].y < lm[pip].y;
const isFingerCurved = (lm, tip, pip, mcp) =>
  lm[pip].y < lm[mcp].y && lm[pip].y < lm[tip].y;

/* ---------- gesture functions (ported 1:1) ---------- */
function isOkSign(lm) {
  if (dist(lm[4], lm[8]) > 0.06) return false;
  return [[12,10],[16,14],[20,18]].every(([t,p]) => isFingerExtended(lm, t, p));
}

function splitHands(hand) {
  // hand.hand_landmarks parallel to hand.handedness
  let left = null, right = null;
  for (let i = 0; i < hand.hand_landmarks.length; i++) {
    const cat = hand.handedness[i][0];
    const name = cat.categoryName ?? cat.category_name;  // JS uses camelCase
    if (name === "Right") left = hand.hand_landmarks[i];  // flipped frame
    else right = hand.hand_landmarks[i];
  }
  return [left, right];
}

function isPlottingGesture(hand) {
  if (hand.hand_landmarks.length < 2) return false;
  const [L, R] = splitHands(hand);
  if (!L || !R) return false;
  let n = 0;
  for (const [tip, pip] of FINGER_JOINTS) {
    if (isFingerExtended(L, tip, pip) && isFingerExtended(R, tip, pip) &&
        dist(L[tip], R[tip]) < 0.08) n++;
  }
  return n >= 3;
}

function mouthAspectRatio(lm) {
  return dist(lm[13], lm[14]) / (dist(lm[78], lm[308]) + 1e-6);
}
function eyeAspectRatio(lm, top, bottom, outer, inner) {
  return dist(lm[top], lm[bottom]) / (dist(lm[outer], lm[inner]) + 1e-6);
}

function isMouthOpenWide(face) {
  if (!face.face_landmarks.length) return false;
  return mouthAspectRatio(face.face_landmarks[0]) > 0.8;
}

function isSquintyPuckering(face) {
  if (!face.face_landmarks.length) return false;
  const lm = face.face_landmarks[0];
  const e1 = eyeAspectRatio(lm, 159, 145, 33, 133);
  const e2 = eyeAspectRatio(lm, 386, 374, 362, 263);
  if (e1 > 0.20 || e2 > 0.20) return false;
  const faceW = dist(lm[33], lm[263]);
  const mouthW = dist(lm[78], lm[308]);
  return mouthW / (faceW + 1e-6) < 0.40;
}

function isGrimacing(face) {
  if (!face.face_landmarks.length) return false;
  const mar = mouthAspectRatio(face.face_landmarks[0]);
  return mar < 0.8 && mar > 0.4;
}

function lipCenter(face) {
  if (!face.face_landmarks.length) return null;
  const lm = face.face_landmarks[0];
  let x = 0, y = 0;
  for (const i of LIP_IDS) { x += lm[i].x; y += lm[i].y; }
  return { x: x / LIP_IDS.length, y: y / LIP_IDS.length };
}
function isNearLips(pt, face, threshold = 0.05) {
  const c = lipCenter(face);
  if (!c) return false;
  return Math.hypot(pt.x - c.x, pt.y - c.y) < threshold;
}

function isIndexOnlyExtended(lm) {
  return isFingerExtended(lm, 8, 6) &&
    !isFingerExtended(lm, 12, 10) &&
    !isFingerExtended(lm, 16, 14) &&
    !isFingerExtended(lm, 20, 18);
}
const isIndexTouchingLips = (hand, face) => isNearLips(hand[8], face);

function isShushing(lm, face) {
  if (!isFingerExtended(lm, 8, 6)) return false;
  let curled = 0;
  for (const [t,p] of [[12,10],[16,14],[20,18]]) if (!isFingerExtended(lm, t, p)) curled++;
  if (curled < 2) return false;
  return isNearLips(lm[8], face, 0.10);
}

function isHeartShape(hand) {
  if (hand.hand_landmarks.length < 2) return false;
  const [L, R] = splitHands(hand);
  if (!L || !R) return false;
  if (L[0].x > 0.5 || R[0].x > 0.5) return false;
  if (dist(L[4], R[4]) > 0.10) return false;
  let curved = 0;
  for (const [tip, pip, mcp] of FINGER_JOINTS)
    if (isFingerCurved(L, tip, pip, mcp) && isFingerCurved(R, tip, pip, mcp)) curved++;
  return curved >= 3;
}

const isPointingUpRightHalf = (lm) => isIndexOnlyExtended(lm) && lm[0].x > 0.5;

function isThumbsUp(lm) {
  const ty = lm[4].y;
  for (let i = 0; i < 21; i++) if (i !== 4 && lm[i].y < ty) return false;
  const wx = lm[0].x, wy = lm[0].y;
  for (const [tip, dip] of [[8,7],[12,11],[16,15],[20,19]]) {
    const td = (lm[tip].x-wx)**2 + (lm[tip].y-wy)**2;
    const dd = (lm[dip].x-wx)**2 + (lm[dip].y-wy)**2;
    if (td >= dd) return false;
  }
  return true;
}
function isThumbsDown(lm) {
  const ty = lm[4].y;
  for (let i = 0; i < 21; i++) if (i !== 4 && lm[i].y > ty) return false;
  const wx = lm[0].x, wy = lm[0].y;
  for (const [tip, dip] of [[8,7],[12,11],[16,15],[20,19]]) {
    const td = (lm[tip].x-wx)**2 + (lm[tip].y-wy)**2;
    const dd = (lm[dip].x-wx)**2 + (lm[dip].y-wy)**2;
    if (td >= dd) return false;
  }
  return true;
}

function isElephantEars(hand, pose) {
  if (hand.hand_landmarks.length < 2) return false;
  if (!pose.pose_landmarks.length) return false;
  const [L, R] = splitHands(hand);
  if (!L || !R) return false;
  const spread = (lm) =>
    [[8,6],[12,10],[16,14],[20,18]].filter(([t,p]) => isFingerExtended(lm,t,p)).length >= 3;
  if (!(spread(L) && spread(R))) return false;
  const p = pose.pose_landmarks[0];
  const leftEar = p[8], rightEar = p[7];
  return Math.abs(L[0].y - leftEar.y) < 0.15 &&
         Math.abs(R[0].y - rightEar.y) < 0.15;
}

function isShrug(hand, face) {
  if (hand.hand_landmarks.length < 2) return false;
  if (!face.face_landmarks.length) return false;
  const f = face.face_landmarks[0];
  const noseX = f[1].x, noseY = f[1].y;
  const faceW = Math.abs(f[33].x - f[263].x) + 1e-6;
  const hands = [...hand.hand_landmarks].sort((a, b) => a[0].x - b[0].x);
  const left = hands[0], right = hands[hands.length - 1];
  for (const h of [left, right]) {
    const rel = (h[0].y - noseY) / faceW;
    if (rel < -1.0 || rel > 3.0) return false;
  }
  if ((noseX - left[0].x) / faceW < 0.5) return false;
  if ((right[0].x - noseX) / faceW < 0.5) return false;
  return true;
}

function elbowAngle(s, e, w) {
  const bax = s.x - e.x, bay = s.y - e.y;
  const bcx = w.x - e.x, bcy = w.y - e.y;
  const cos = (bax*bcx + bay*bcy) /
    (Math.hypot(bax,bay) * Math.hypot(bcx,bcy) + 1e-6);
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}

function isFlexingLeftArm(hand, pose) {
  if (hand.hand_landmarks.length > 1) return false;
  if (!pose.pose_landmarks.length) return false;
  const lm = pose.pose_landmarks[0];
  const shoulder = lm[12], elbow = lm[14], wrist = lm[16];
  // reject occluded / off-frame joints — the pose model returns all 33
  // landmarks even when unseen, extrapolating them with low visibility.
  if (Math.min(shoulder.visibility ?? 0, elbow.visibility ?? 0, wrist.visibility ?? 0) < 0.5)
    return false;
  if (elbowAngle(shoulder, elbow, wrist) > 100) return false;
  if (wrist.y >= elbow.y) return false;
  if (elbow.y < shoulder.y - 0.1) return false;
  return true;
}

function headDirection(face) {
  if (!face.face_landmarks.length) return null;
  const lm = face.face_landmarks[0];
  const eyeSpan = Math.abs(lm[33].x - lm[263].x) + 1e-6;
  const diff = (lm[1].x - (lm[33].x + lm[263].x) / 2) / eyeSpan;
  if (diff < -0.15) return "left";
  if (diff > 0.15) return "right";
  return null;
}

/* ---------- priority resolver (ported from detect_pose) ---------- */
function detectPose(hand, face, pose) {
  let left = null, right = null;
  if (hand.hand_landmarks.length) {
    [left, right] = splitHands(hand);
    if (isPlottingGesture(hand)) return 1;
    if (isHeartShape(hand)) return 6;
    if (isElephantEars(hand, pose)) return 10;
    if (left) {
      if (isOkSign(left)) return 0;
      if (isShushing(left, face)) return 5;
      if (isThumbsDown(left)) return 9;
      if (isThumbsUp(left)) return 11;
    }
    if (right) {
      if (isIndexTouchingLips(right, face)) return 4;
      if (isPointingUpRightHalf(right)) return 7;
    }
  }
  const thumbOut = left && (isThumbsUp(left) || isThumbsDown(left));
  if (!thumbOut && isFlexingLeftArm(hand, pose)) return 8;
  if (isShrug(hand, face)) return 12;
  if (isMouthOpenWide(face)) return 2;
  if (isSquintyPuckering(face)) return 3;
  if (isGrimacing(face)) return 13;
  const d = headDirection(face);
  if (d === "left") return 15;
  if (d === "right") return 14;
  return 16;
}

/* ---------- drawing ---------- */
function drawLandmarks(pts) {
  ctx.strokeStyle = "#00ff00"; ctx.lineWidth = 2;
  for (const [a, b] of HAND_CONNECTIONS) {
    ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke();
  }
  ctx.fillStyle = "#ff0000";
  for (const p of pts) { ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill(); }
}

function overlayImage(img, side = "left") {
  const W = canvas.width, H = canvas.height;
  const ih = H / 3;
  const iw = img.width * ih / img.height;
  const x0 = side === "left" ? 0 : W - iw;
  ctx.drawImage(img, x0, H - ih, iw, ih);
}

/* ---------- image assets (images/image0.png … image16.png) ---------- */
const images = {};
function placeholder(i) {
  const c = document.createElement("canvas");
  c.width = c.height = 200;
  const g = c.getContext("2d");
  g.fillStyle = "#3c3c3c"; g.fillRect(0, 0, 200, 200);
  g.fillStyle = "#c8c8c8"; g.font = "bold 90px sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(String(i), 100, 110);
  return c;
}
function loadImages() {
  for (let i = 0; i < 17; i++) {
    const img = new Image();
    img.onload = () => { images[i] = img; };
    img.onerror = () => { images[i] = placeholder(i); };
    img.src = `images/image${i}.png`;
    images[i] = placeholder(i); // until/if it loads
  }
}

/* ---------- result adapters (JS field names -> Python field names) ---------- */
const adaptHand = (r) => ({ hand_landmarks: r.landmarks || [], handedness: r.handednesses || [] });
const adaptFace = (r) => ({ face_landmarks: r.faceLandmarks || [] });
const adaptPose = (r) => ({ pose_landmarks: r.landmarks || [] });

/* ---------- pose names + discovery panel ---------- */
const POSE_NAMES = [
  "OK Sign", "Plotting", "Mouth Wide", "Squinting", "Lips Touch",
  "Shushing", "Heart", "Pointing Up", "Flexing", "Thumbs Down",
  "Elephant Ears", "Thumbs Up", "Shrug", "Grimace", "Head Right",
  "Head Left", "Neutral"
];
const discovered = new Set();
const grid = document.getElementById("grid");
const counter = document.getElementById("counter");

function recordPose(idx) {
  if (idx == null || discovered.has(idx)) return;
  discovered.add(idx);
  const img = new Image();
  img.src = `images/image${idx}.png`;
  grid.appendChild(img);
  counter.textContent = `${discovered.size}/17`;
}
recordPose(16);

/* ---------- main loop ---------- */
let handLmk, faceLmk, poseLmk, video, lastTs = 0;
let frameCount = 0;
// face/pose are heavy and slow-changing, so we run them on alternate frames
// and reuse the last result in between. Hand runs every frame (fast-moving).
let lastFace = { face_landmarks: [] };
let lastPose = { pose_landmarks: [] };

async function init() {
  loadImages();
  statusEl.textContent = "loading models…";
  const vision = await FilesetResolver.forVisionTasks(
    `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VISION_VER}/wasm`
  );
  handLmk = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: HAND_MODEL, delegate: "CPU" }, runningMode: "VIDEO",
    numHands: 2, minHandDetectionConfidence: 0.7,
    minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  faceLmk = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: FACE_MODEL, delegate: "CPU" }, runningMode: "VIDEO",
    numFaces: 1, minFaceDetectionConfidence: 0.5,
    minFacePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  poseLmk = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: POSE_MODEL, delegate: "CPU" }, runningMode: "VIDEO",
    numPoses: 1, minPoseDetectionConfidence: 0.5,
    minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });

  statusEl.textContent = "requesting camera…";
  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  video = document.createElement("video");
  video.srcObject = stream; video.playsInline = true;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const panelEl = document.getElementById("panel");
  function resize() {
    const mobile = window.innerWidth <= 768;
    if (mobile) {
      const scale = Math.min(
        window.innerWidth / canvas.width,
        (window.innerHeight * 0.75) / canvas.height
      );
      canvas.style.width = (canvas.width * scale) + "px";
      canvas.style.height = (canvas.height * scale) + "px";
    } else {
      const panelW = 300;
      const scale = Math.min(
        (window.innerWidth - panelW - 8) / canvas.width,
        (window.innerHeight * 0.75) / canvas.height
      );
      canvas.style.width = (canvas.width * scale) + "px";
      canvas.style.height = (canvas.height * scale) + "px";
      panelEl.style.left = (canvas.width * scale + 8) + "px";
    }
  }
  resize();
  window.addEventListener("resize", resize);
  statusEl.textContent = "";
  requestAnimationFrame(loop);
}

function loop() {
  const W = canvas.width, H = canvas.height;

  // draw mirrored video (matches Python's cv2.flip) — detection runs on this
  ctx.save();
  ctx.translate(W, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore();

  let ts = performance.now();
  if (ts <= lastTs) ts = lastTs + 1;
  lastTs = ts;

  // hand every frame; face and pose alternate (one per frame) to stay within
  // the frame budget — this keeps the hand stream from starving and flickering.
  const hand = adaptHand(handLmk.detectForVideo(canvas, ts));
  if (frameCount % 2 === 0) {
    lastFace = adaptFace(faceLmk.detectForVideo(canvas, ts));
  } else {
    lastPose = adaptPose(poseLmk.detectForVideo(canvas, ts));
  }
  frameCount++;
  const face = lastFace, pose = lastPose;

  // landmark points are normalized in the mirrored frame -> scale to pixels
  for (const lms of hand.hand_landmarks)
    drawLandmarks(lms.map(p => ({ x: p.x * W, y: p.y * H })));

  const idx = detectPose(hand, face, pose);
  recordPose(idx);
  if (idx != null && images[idx]) overlayImage(images[idx], "left");

  requestAnimationFrame(loop);
}

init().catch(err => { statusEl.textContent = "error: " + err.message; console.error(err); });
</script>
</body>
</html>
